[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oprb-lab"
version = "0.1.0"
description = "Pretrained OCR and VLM evaluation on occluded OPRB pages"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "huggingface-hub>=0.30", "rapidfuzz>=3", "pandas>=2", "jinja2>=3", "matplotlib>=3.8", "tqdm>=4.66"]

[project.optional-dependencies]
internvl = ["transformers==4.48.3", "accelerate>=1,<2", "einops", "timm>=1,<2", "sentencepiece"]
paddle = ["paddleocr==3.2.0"]
easyocr = ["easyocr==1.7.2"]
rapid = ["rapidocr-onnxruntime==1.4.4"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
